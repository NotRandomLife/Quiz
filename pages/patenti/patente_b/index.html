<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Quiz Patente B (generale)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white;text-align:center;padding:20px;}
.link-box{margin:20px auto;padding:20px;max-width:600px;background:#020617;border-radius:14px;box-shadow:0 0 12px rgba(0,0,0,0.5);}
button{background:#1e293b;color:white;padding:10px 20px;border:0;border-radius:12px;margin:10px;cursor:pointer;}
button:hover{background:#334155;}
.back-btn{
 background:#1e293b;
 color:white;
 padding:10px 20px;
 border:0;
 border-radius:12px;
 margin:15px;
 cursor:pointer;
}

/* Mobile app style enhancement */
body {
  background: radial-gradient(circle at top, #1f2937 0, #020617 45%, #000000 100%);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.quiz-container,
.link-box {
  border-radius: 24px !important;
  box-shadow: 0 18px 40px rgba(0,0,0,0.75) !important;
  padding: 20px 18px !important;
}
.button-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 480px;
  margin: 20px auto;
}
.button-container .link-box a,
.nav-buttons a {
  display: block;
  border-radius: 999px;
  padding: 14px 22px;
  font-weight: 600;
  text-decoration: none;
  text-align: center;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  color: white !important;
  box-shadow: 0 12px 24px rgba(15,23,42,0.9);
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.button-container .link-box a:hover,
.nav-buttons a:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 32px rgba(15,23,42,0.95);
}
button,
.opt-btn,
.start-btn,
.next-btn,
#start-quiz,
#next-question {
  border-radius: 999px !important;
  padding: 12px 20px !important;
  font-weight: 600;
  border: none;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
  box-shadow: 0 10px 22px rgba(22,163,74,0.6);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
button:hover,
.opt-btn:hover,
.start-btn:hover,
.next-btn:hover,
#start-quiz:hover,
#next-question:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 30px rgba(22,163,74,0.85);
}
.question {
  font-size: 1.2rem;
  line-height: 1.5;
}
.options {
  gap: 10px;
}
@media (max-width: 600px) {
  body {
    padding: 16px;
  }
  .quiz-container {
    margin: 12px auto;
    padding: 18px 14px !important;
  }
  .question {
    font-size: 1.05rem;
  }
}

</style>
<script src="/assets/js/question-bank.js"></script>
</head>
<body>
<button onclick="history.back()" class="back-btn">⬅ Indietro</button>
<button class="home-btn" onclick="location.href='../../../index.html'" style="background:#1e293b;color:white;padding:10px 20px;border:0;border-radius:12px;margin:15px;cursor:pointer;">🏠 Home</button>

<h2>Quiz Patente B (generale)</h2>
<div class="link-box"><span id="domanda"></span></div>
<button onclick="mostra()">Mostra risposta</button>
<div class="link-box"><span id="risposta"></span></div>
<button onclick="nuova()">Nuova domanda</button>

<script>
const domande = window.QuizManiaQuestionBank.fromFacts("patente_b").map((item) => ({
  q: item.q,
  a: item.options[item.correct]
}));

let corrente = null;

function nuova() {
  const i = Math.floor(Math.random() * domande.length);
  corrente = domande[i];
  document.getElementById("domanda").innerText = corrente.q;
  document.getElementById("risposta").innerText = "";
}

function mostra() {
  if (!corrente) return;
  document.getElementById("risposta").innerText = corrente.a;
}

window.onload = nuova;
</script>

</body>
</html>
